controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute
book_add_to_favorites:
    path: /add-to-favorites
    methods: [POST]
    controller: App\Controller\BookController::addToFavorites
book_remove_from_favorites:
    path: /remove-from-favorites
    methods: [ POST ]
    controller: App\Controller\BookController::removeFromFavorites

app_search_results:
    path: /searchresults
    controller: App\Controller\SearchResultsController::results
    methods: [POST]

app_filter_meeting:
    path: /filtermeeting
    controller: App\Controller\MeetingController::filter
    methods: [POST]

not_found:
    path: /{any}
    controller: App\Controller\HomeController::redirectToHomePage
    requirements:
        any: .+


app_add_meeting_api_controller:
    path: /addmeetingapicontroller
    controller: App\Controller\AddMeetingApiController::meeting
    methods: [POST]
